apiVersion: v1
kind: Service
metadata:
  annotations:
    "service.beta.kubernetes.io/aws-load-balancer-internal": "true"
  name: eks-sample-node-service
  labels:
    app: eks-sample-node-app
spec:
  selector:
    app: eks-sample-node-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
