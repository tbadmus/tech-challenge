name: app-build-deploy

# Builds the container, scans it, pushes it, and rolls it out by DIGEST.
#
# The pipeline this replaces did `docker tag node $REPO_URL` -- no tag at all,
# so an implicit :latest -- into a mutable repository, then `sed -i` the URL
# into a tracked manifest. The pod spec never changed between builds, so with
# imagePullPolicy: IfNotPresent new code never actually rolled out.
on:
  push:
    branches: [dev, main]
    # Only the application. Editing this workflow cannot change what is
    # deployed, so it should not trigger a deployment -- that is how a
    # CI-only merge ended up deploying into a cluster that no longer existed.
    paths: ['app/**']
  workflow_dispatch:

concurrency:
  # Deliberately the SAME group as terraform-apply so the two serialize. See
  # that file for why. Note this cannot be solved with `workflow_run`: GitHub
  # only fires that event for workflow files present on the DEFAULT branch, and
  # this repository's default branch does not carry them.
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # Region is read from environments/<env>.tfvars at run time so it is
  # defined in exactly one place. See the "Resolve region" step.
  TF_ENV_DEFAULT: dev

jobs:
  # Queueing alone is not enough. The concurrency group prevents the two
  # workflows overlapping, but says nothing about whether the infrastructure
  # actually came out healthy -- a terraform-apply can finish, or be cancelled,
  # and still leave no usable cluster. Assert it, and fail with a sentence that
  # names the cause instead of a kubectl timeout forty lines into a later job.
  preflight:
    name: infrastructure ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-preflight-${{ github.run_id }}

      - name: Cluster exists and is ACTIVE
        run: |
          set -euo pipefail
          STATUS="$(aws eks describe-cluster --name "$CLUSTER_NAME" \
            --query cluster.status --output text 2>/dev/null || echo ABSENT)"
          if [ "$STATUS" = "ABSENT" ]; then
            echo "::error::Cluster $CLUSTER_NAME does not exist. Run the terraform-apply workflow first, or 'make up ENV=dev' locally. Nothing was deployed."
            exit 1
          fi
          for i in $(seq 1 40); do
            [ "$STATUS" = "ACTIVE" ] && break
            echo "cluster is $STATUS, waiting..."
            sleep 15
            STATUS="$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text)"
          done
          [ "$STATUS" = "ACTIVE" ] || { echo "::error::Cluster $CLUSTER_NAME is $STATUS, not ACTIVE"; exit 1; }
          echo "cluster $CLUSTER_NAME is ACTIVE"

      - name: Load balancer controller is installed
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          if ! kubectl -n kube-system get deploy aws-load-balancer-controller >/dev/null 2>&1; then
            echo "::error::The AWS Load Balancer Controller is not installed, so the Ingress in this deploy would never get an ALB. Apply the cluster-addons root first: make addons-apply ENV=dev"
            exit 1
          fi
          kubectl -n kube-system rollout status deploy/aws-load-balancer-controller --timeout=300s

  scan:
    name: scan source
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single source of truth: everything account- and environment-specific is
      # read from environments/<env>.tfvars, so no value is duplicated into
      # this file where it would silently drift.
      - name: Resolve configuration
        run: |
          set -euo pipefail
          ENV="${TF_ENV:-${TF_ENV_DEFAULT}}"
          F="environments/${ENV}.tfvars"
          test -f "$F" || { echo "missing $F"; exit 1; }
          val() { awk -F'"' -v k="$1" '$0 ~ "^[[:space:]]*"k"[[:space:]]*=" {print $2; exit}' "$F"; }
          REGION="$(val region)"
          PROJECT="$(val project)"; PROJECT="${PROJECT:-tech-challenge}"
          ECR="$(val ecr_repository_name)"; ECR="${ECR:-hello-world}"
          {
            echo "AWS_REGION=$REGION"
            echo "TF_ENV=$ENV"
            echo "PROJECT=$PROJECT"
            echo "ECR_REPOSITORY=$ECR"
            echo "CLUSTER_NAME=${PROJECT}-${ENV}-cluster"
            echo "TF_VAR_github_repository=${GITHUB_REPOSITORY}"
          } >> "$GITHUB_ENV"
          echo "env=$ENV region=$REGION cluster=${PROJECT}-${ENV}-cluster"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app
          # `--security-checks vuln,config` in the old Jenkinsfile was renamed
          # to --scanners years ago, and `config` became `misconfig`, so on any
          # current Trivy that step errored or silently scanned nothing.
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          # Blocking. The old invocation passed no exit code, so findings were
          # printed and ignored.
          exit-code: '1'
          ignore-unfixed: true

  build:
    name: build / scan image / push
    runs-on: ubuntu-latest
    needs: scan
    environment: dev
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Single source of truth: everything account- and environment-specific is
      # read from environments/<env>.tfvars, so no value is duplicated into
      # this file where it would silently drift.
      - name: Resolve configuration
        run: |
          set -euo pipefail
          ENV="${TF_ENV:-${TF_ENV_DEFAULT}}"
          F="environments/${ENV}.tfvars"
          test -f "$F" || { echo "missing $F"; exit 1; }
          val() { awk -F'"' -v k="$1" '$0 ~ "^[[:space:]]*"k"[[:space:]]*=" {print $2; exit}' "$F"; }
          REGION="$(val region)"
          PROJECT="$(val project)"; PROJECT="${PROJECT:-tech-challenge}"
          ECR="$(val ecr_repository_name)"; ECR="${ECR:-hello-world}"
          {
            echo "AWS_REGION=$REGION"
            echo "TF_ENV=$ENV"
            echo "PROJECT=$PROJECT"
            echo "ECR_REPOSITORY=$ECR"
            echo "CLUSTER_NAME=${PROJECT}-${ENV}-cluster"
            echo "TF_VAR_github_repository=${GITHUB_REPOSITORY}"
          } >> "$GITHUB_ENV"
          echo "env=$ENV region=$REGION cluster=${PROJECT}-${ENV}-cluster"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-app-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          # Nodes are x86_64; the platform is explicit so a build on an arm64
          # runner cannot silently produce an image the cluster cannot run.
          platforms: linux/amd64
          load: true
          tags: local/hello-world:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/hello-world:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Tag and push
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IMAGE="$REGISTRY/${ECR_REPOSITORY}:${SHORT_SHA}"
          docker tag "local/hello-world:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$SHORT_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE @ $DIGEST"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    steps:
      - uses: actions/checkout@v4

      # Single source of truth: everything account- and environment-specific is
      # read from environments/<env>.tfvars, so no value is duplicated into
      # this file where it would silently drift.
      - name: Resolve configuration
        run: |
          set -euo pipefail
          ENV="${TF_ENV:-${TF_ENV_DEFAULT}}"
          F="environments/${ENV}.tfvars"
          test -f "$F" || { echo "missing $F"; exit 1; }
          val() { awk -F'"' -v k="$1" '$0 ~ "^[[:space:]]*"k"[[:space:]]*=" {print $2; exit}' "$F"; }
          REGION="$(val region)"
          PROJECT="$(val project)"; PROJECT="${PROJECT:-tech-challenge}"
          ECR="$(val ecr_repository_name)"; ECR="${ECR:-hello-world}"
          {
            echo "AWS_REGION=$REGION"
            echo "TF_ENV=$ENV"
            echo "PROJECT=$PROJECT"
            echo "ECR_REPOSITORY=$ECR"
            echo "CLUSTER_NAME=${PROJECT}-${ENV}-cluster"
            echo "TF_VAR_github_repository=${GITHUB_REPOSITORY}"
          } >> "$GITHUB_ENV"
          echo "env=$ENV region=$REGION cluster=${PROJECT}-${ENV}-cluster"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Set image by digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          cd app/k8s
          # kustomize edit writes the reference; nothing sed-edits a tracked
          # file in place, and the change is scoped to this checkout.
          kustomize edit set image "hello-world=${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          kubectl kustomize . | head -40

      - name: Apply
        run: |
          set -euo pipefail
          kubectl apply -k app/k8s
          kubectl -n demo rollout status deploy/hello-world --timeout=5m

      - name: Verify the running digest is the one just built
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          RUNNING="$(kubectl -n demo get pods -o jsonpath='{.items[0].spec.containers[0].image}')"
          echo "running: $RUNNING"
          case "$RUNNING" in
            *"$DIGEST") echo "OK — running the digest built by this run" ;;
            *) echo "MISMATCH — expected $DIGEST"; exit 1 ;;
          esac
