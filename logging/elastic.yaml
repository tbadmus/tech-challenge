
kind: Service
apiVersion: v1
metadata:
  name: elasticsearch
  labels:
    app: "elasticsearch"
spec:
  type: ClusterIP
  selector:
    app: "elasticsearch"
  ports:
  - name: http
    protocol: TCP
    port: 9200
  - name: transport
    protocol: TCP
    port: 9300
---
# Source: elasticsearch/templates/service.yaml
kind: Service
apiVersion: v1
metadata:
  name: elasticsearch-headless
  labels:
    app: "elasticsearch"
spec:
  clusterIP: None # This is needed for statefulset hostnames like elasticsearch-0 to resolve
  # Create endpoints also if the related pod isn't ready
  publishNotReadyAddresses: true
  selector:
    app: "elasticsearch"
  ports:
  - name: http
    port: 9200
  - name: transport
    port: 9300
---
# Source: elasticsearch/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app: "elasticsearch"
spec:
  serviceName: elasticsearch-headless
  selector:
    matchLabels:
     app: "elasticsearch"
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 30Gi
  template:
    metadata:
      name: "elasticsearch"
      labels:
        app: "elasticsearch"
    spec:
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 120
      enableServiceLinks: true
      initContainers:
      - name: configure-sysctl
        image: "ubuntu"
        imagePullPolicy: "IfNotPresent"
        command: ["/bin/chown","-R","1000:1000", "/usr/share/elasticsearch/data"]
        volumeMounts:
          - name: "elasticsearch"
            mountPath: /usr/share/elasticsearch/data        
      containers:
      - name: "elasticsearch"
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        image: "docker.elastic.co/elasticsearch/elasticsearch:7.15.2"
        imagePullPolicy: "IfNotPresent"
        ports:
        - name: http
          containerPort: 9200
        - name: transport
          containerPort: 9300
        resources:
          limits:
            cpu: 1000m
            memory: 1500Mi
          requests:
            cpu: 1000m
            memory: 1500Mi
        env:
          - name: node.name
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: node.roles
            value: "master,ingest,data,"
          - name: discovery.type
            value: "single-node"
          - name: cluster.name
            value: "elasticsearch"
          - name: network.host
            value: "0.0.0.0"
          - name: ELASTIC_PASSWORD
            value: "ELASTIC-PASSWORD"
          - name: xpack.security.enabled
            value: "true"
        volumeMounts:
          - name: "elasticsearch"
            mountPath: /usr/share/elasticsearch/data
